<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#F5F0E8"/>

  <!-- Subtle cream ring -->
  <circle cx="640" cy="320" r="150" fill="none" stroke="#DED4C0" stroke-width="4" opacity="0.9"/>

  <!-- Concentric red arcs (top-right) -->
  <g stroke="#D2251C" stroke-width="9" fill="none" stroke-linecap="round">
    <path d="M 917 98 A 40 40 0 0 1 1071 157"/>
    <path d="M 901 81 A 68 68 0 0 1 1101 139"/>
    <path d="M 885 64 A 96 96 0 0 1 1131 120"/>
  </g>

  <!-- Black square with off-white circular cutout -->
  <mask id="sq">
    <rect x="720" y="110" width="100" height="100" fill="#fff"/>
    <circle cx="765" cy="155" r="22" fill="#000"/>
  </mask>
  <rect x="720" y="110" width="100" height="100" fill="#1A1A1A" mask="url(#sq)"/>

  <!-- Dot matrix (charcoal) -->
  <g fill="#1A1A1A" opacity="0.85">
    <circle cx="752" cy="252" r="5"/><circle cx="774" cy="252" r="5"/><circle cx="796" cy="252" r="5"/><circle cx="818" cy="252" r="5"/><circle cx="840" cy="252" r="5"/>
    <circle cx="752" cy="274" r="5"/><circle cx="774" cy="274" r="5"/><circle cx="796" cy="274" r="5"/><circle cx="818" cy="274" r="5"/><circle cx="840" cy="274" r="5"/>
    <circle cx="752" cy="296" r="5"/><circle cx="774" cy="296" r="5"/><circle cx="796" cy="296" r="5"/><circle cx="818" cy="296" r="5"/><circle cx="840" cy="296" r="5"/>
    <circle cx="752" cy="318" r="5"/><circle cx="774" cy="318" r="5"/><circle cx="796" cy="318" r="5"/><circle cx="818" cy="318" r="5"/><circle cx="840" cy="318" r="5"/>
    <circle cx="752" cy="340" r="5"/><circle cx="774" cy="340" r="5"/><circle cx="796" cy="340" r="5"/><circle cx="818" cy="340" r="5"/><circle cx="840" cy="340" r="5"/>
  </g>

  <!-- Charcoal circle with off-white cutout ring -->
  <mask id="ring">
    <circle cx="940" cy="420" r="150" fill="#fff"/>
    <circle cx="1010" cy="360" r="44" fill="#000"/>
  </mask>
  <circle cx="940" cy="420" r="150" fill="#1A1A1A" mask="url(#ring)"/>

  <!-- Red half-disc (lower semicircle, flat top) -->
  <path d="M 726 332 A 34 34 0 0 0 794 332 Z" fill="#D2251C"/>

  <!-- Diagonal architectural hatching (right edge) -->
  <pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <line x1="0" y1="0" x2="0" y2="12" stroke="#1A1A1A" stroke-width="3"/>
  </pattern>
  <rect x="1110" y="60" width="54" height="240" fill="url(#hatch)"/>

  <!-- Left text panel -->
  <!-- Accent square -->
  <rect x="62" y="44" width="30" height="30" fill="#D2251C"/>

  <!-- Wordmark -->
  <text x="60" y="168" font-family="'Space Grotesk', 'Inter', sans-serif" font-size="120" font-weight="700" fill="#1A1A1A">ADELLHUB</text>

  <!-- Tagline -->
  <text x="60" y="246" font-family="'Space Grotesk', 'Inter', sans-serif" font-size="44" font-weight="700" fill="#1A1A1A">EKOSISTEM IT MASA DEPAN.</text>

  <!-- Red accent bar -->
  <rect x="60" y="268" width="46" height="5" fill="#D2251C"/>

  <!-- Services line -->
  <text x="60" y="320" font-family="'Inter', 'Space Grotesk', sans-serif" font-size="28" font-weight="400" fill="#757575">Adellwork · Adelltech · Adellbooth</text>

  <!-- URL -->
  <rect x="60" y="534" width="16" height="16" fill="#D2251C"/>
  <text x="90" y="548" font-family="'Space Grotesk', 'Inter', sans-serif" font-size="30" font-weight="500" fill="#1A1A1A" letter-spacing="1">adellhub.biz.id</text>
</svg>