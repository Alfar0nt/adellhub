<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" fill="none">
  <rect width="400" height="250" fill="#F5F0E8" />

  <!-- Laptop screen -->
  <rect x="50" y="52" width="220" height="142" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="4" />
  <!-- Webcam -->
  <rect x="150" y="56" width="16" height="6" fill="#1A1A1A" />
  <!-- Red progress / installation bar -->
  <rect x="70" y="172" width="110" height="12" fill="#E63329" />
  <!-- Screen accent dot -->
  <rect x="248" y="66" width="8" height="8" fill="#1A1A1A" />

  <!-- Laptop base (keyboard deck) -->
  <polygon points="62,194 258,194 286,222 34,222" fill="#1A1A1A" />

  <!-- Gear: hardware / service -->
  <circle cx="330" cy="95" r="44" stroke="#1A1A1A" stroke-width="6" />
  <circle cx="330" cy="95" r="13" fill="#E63329" />
  <line x1="330" y1="42" x2="330" y2="32" stroke="#1A1A1A" stroke-width="6" />
  <line x1="330" y1="148" x2="330" y2="158" stroke="#1A1A1A" stroke-width="6" />
  <line x1="277" y1="95" x2="267" y2="95" stroke="#1A1A1A" stroke-width="6" />

  <!-- Square with cutout circle accent (bottom-right) -->
  <rect x="330" y="170" width="50" height="50" fill="#1A1A1A" />
  <circle cx="355" cy="195" r="17" fill="#F5F0E8" />
</svg>