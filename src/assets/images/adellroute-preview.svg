<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" fill="none">
  <!-- Background -->
  <rect width="400" height="250" fill="#F5F0E8" />

  <!-- Top-left Bauhaus dot grid -->
  <g fill="#1A1A1A">
    <circle cx="36" cy="32" r="3" />
    <circle cx="52" cy="32" r="3" />
    <circle cx="68" cy="32" r="3" />
    <circle cx="36" cy="48" r="3" />
    <circle cx="52" cy="48" r="3" />
    <circle cx="68" cy="48" r="3" />
  </g>

  <!-- Top-right Red Bauhaus square accent -->
  <rect x="356" y="24" width="16" height="16" fill="#D2251C" />

  <!-- INGRESS / INPUT TOKEN CLIENT (Left) -->
  <rect x="30" y="82" width="68" height="86" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="3" />
  <!-- Token bars representing incoming prompt / payload -->
  <rect x="40" y="96" width="48" height="8" fill="#1A1A1A" />
  <rect x="40" y="110" width="32" height="8" fill="#1E40AF" />
  <rect x="40" y="124" width="42" height="8" fill="#1A1A1A" />
  <circle cx="50" cy="148" r="4" fill="#D2251C" />
  <circle cx="64" cy="148" r="4" fill="#1E40AF" />
  <circle cx="78" cy="148" r="4" fill="#1A1A1A" />

  <!-- Input bus conduit line to Central Router Core -->
  <path d="M 98 125 H 148" stroke="#1A1A1A" stroke-width="4" stroke-linecap="round" />
  <polygon points="144,119 156,125 144,131" fill="#1A1A1A" />

  <!-- CENTRAL AI ROUTER CORE (Cobalt Blue + Bauhaus Matrix) -->
  <!-- Outer chassis frame -->
  <rect x="160" y="62" width="126" height="126" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="4" />

  <!-- Decorative corner brackets -->
  <rect x="152" y="54" width="16" height="16" fill="#1E40AF" />
  <rect x="278" y="180" width="16" height="16" fill="#1E40AF" />

  <!-- Internal neural processor block -->
  <rect x="178" y="80" width="90" height="90" fill="#172554" />
  <rect x="194" y="96" width="58" height="58" fill="#1E40AF" stroke="#FFFFFF" stroke-width="2" />

  <!-- Core token matrix / routing node -->
  <rect x="211" y="113" width="24" height="24" fill="#FFFFFF" />
  <rect x="217" y="119" width="12" height="12" fill="#D2251C" />

  <!-- Top latency / status indicator bars -->
  <rect x="178" y="70" width="24" height="4" fill="#1E40AF" />
  <rect x="208" y="70" width="34" height="4" fill="#D2251C" />
  <rect x="248" y="70" width="20" height="4" fill="#1A1A1A" />

  <!-- EGRESS / MULTI-MODEL ROUTING CONDUIT (Right) -->
  <path d="M 286 125 H 316 M 316 66 V 184 M 316 66 H 334 M 316 125 H 334 M 316 184 H 334" stroke="#1A1A1A" stroke-width="3" stroke-linecap="square" />

  <!-- Target Model 1: OpenAI / Claude endpoint (Top) -->
  <rect x="334" y="48" width="44" height="36" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="3" />
  <circle cx="356" cy="66" r="7" fill="#1E40AF" />

  <!-- Target Model 2: DeepSeek / Fast Throughput endpoint (Middle) -->
  <rect x="334" y="107" width="44" height="36" fill="#1A1A1A" />
  <rect x="345" y="118" width="22" height="14" fill="#D2251C" />

  <!-- Target Model 3: Gemini / Multimodal endpoint (Bottom) -->
  <rect x="334" y="166" width="44" height="36" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="3" />
  <rect x="346" y="177" width="20" height="14" fill="#1E40AF" />

  <!-- Bottom-left Bauhaus hatching accent -->
  <g stroke="#1A1A1A" stroke-width="3">
    <line x1="24" y1="202" x2="60" y2="232" />
    <line x1="38" y1="202" x2="74" y2="232" />
    <line x1="52" y1="202" x2="88" y2="232" />
  </g>

  <!-- Bottom-right Cobalt Blue accent pill -->
  <rect x="290" y="218" width="70" height="8" fill="#1E40AF" />
</svg>
